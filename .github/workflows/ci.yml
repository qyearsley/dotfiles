name: CI

# Syntax checks only. The files are examples, so the useful check is that each
# one still parses.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Check that each example parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck cannot parse zsh (`zshrc` uses glob qualifiers like
      # `(#qN.mh+24)`), so zsh itself does the syntax check.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh neovim
      - run: zsh -n zshrc

      # loadfile() compiles the file without running it, so this never reaches
      # lazy.nvim or the network. cquit sets the exit code; a plain
      # command-line error from nvim does not.
      - name: nvim/init.lua parses
        run: |
          nvim --headless --clean -u NONE -c "lua local ok, err = loadfile('nvim/init.lua'); if ok then vim.cmd('cquit 0') else print(err); vim.cmd('cquit 1') end"

      - name: starship.toml parses
        run: python3 -c "import tomllib; tomllib.load(open('starship.toml', 'rb'))"

      - name: gitconfig parses
        run: git config --file gitconfig --list > /dev/null
